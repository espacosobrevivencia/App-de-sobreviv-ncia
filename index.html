function daysFromToday(date){if(!date)return null;const today=new Date();today.setHours(12,0,0,0);const target=new Date(date+"T12:00:00");return Math.ceil((target-today)/86400000)}
function inventoryStatus(item){
  item=item&&typeof item==="object"?item:{};
  const low=Number(item.minimum)>0&&Number(item.quantity)<=Number(item.minimum);
  const dd=daysFromToday(typeof item.expiry==="string"?item.expiry:"");
  const expired=dd!==null&&dd<0;
  const expiring=dd!==null&&dd>=0&&dd<=30;
  return {low,expired,expiring,dd};
}
function maintenanceStatus(item){
  item=item&&typeof item==="object"?item:{};
  const dd=daysFromToday(typeof item.due==="string"?item.due:"");
  return {due:dd!==null&&dd<=0,soon:dd!==null&&dd>0&&dd<=14,dd};
}

}

function waterCalculator(prefix){return `<form id="${prefix}WaterForm"><div class="form-grid"><div class="field"><label>Pessoas</label><input name="people" type="number" min="1" value="1" required></div><div class="field"><label>Dias</label><input name="days" type="number" min="1" value="3" required></div><div class="field"><label>Estimativa de L/pessoa/dia</label><input name="liters" type="number" min="0.1" step="0.1" value="3" required></div><div class="field"><label>Reserva extra (%)</label><input name="reserve" type="number" min="0" value="20" required></div></div><div class="notice">3 L/pessoa/dia é apenas um valor inicial de planejamento. Necessidade real varia com clima, esforço, idade, alimentação e condição individual. Considere também água separada para higiene, preparo de alimentos e outros usos.</div><button class="btn primary full" type="submit">Calcular água</button><div id="${prefix}WaterResult" class="result" hidden></div></form>`}
function waterReserveCalculator(prefix){return `<form id="${prefix}ReserveForm"><div class="form-grid three"><div class="field"><label>Água disponível (L)</label><input name="available" type="number" min="0" step="0.1" required></div><div class="field"><label>Pessoas</label><input name="people" type="number" min="1" value="1" required></div><div class="field"><label>Estimativa de L/pessoa/dia</label><input name="liters" type="number" min="0.1" step="0.1" value="3" required></div></div><button class="btn primary full" type="submit">Calcular duração</button><div id="${prefix}ReserveResult" class="result" hidden></div></form>`}
function renderWater(){view.innerHTML=`${pageHeader("💧","Água","Priorize fonte segura, recipiente limpo e tratamento verificável.")}<section class="panel priority-panel"><h2>Quanto tempo minha reserva dura?</h2>${waterReserveCalculator("water")}</section><section class="panel"><h2>Planejar quantidade</h2>${waterCalculator("main")}</section><section class="panel"><h2>Tratamento: não misture os conceitos</h2><ol class="protocol"><li><strong>Fonte:</strong> prefira água potável lacrada ou fornecida por fonte confiável.</li><li><strong>Filtração/coagem:</strong> pode remover partículas, mas não garante que a água se torne potável.</li><li><strong>Fervura:</strong> quando essa for a alternativa apropriada, filtre ou coe e ferva por 5 minutos após o início da ebulição.</li><li><strong>Desinfecção química:</strong> siga somente a concentração e o procedimento do rótulo ou de fonte oficial confiável; este app não calcula dose.</li><li><strong>Armazenamento:</strong> use recipiente limpo, tampado e evite recontaminação.</li></ol><div class="notice danger"><strong>Contaminação química:</strong> água com combustível, solventes, pesticidas ou outros produtos químicos pode continuar insegura mesmo depois de filtrar ou ferver. Não presuma que esses métodos removem contaminantes químicos.</div></section>`}
function renderShelter(){view.innerHTML=`${pageHeader("🏕️","Abrigo","Reduza exposição sem criar um risco novo.")}<section class="panel"><h2>Escolha do local</h2><ul class="protocol"><li>Evite leitos secos de rios, áreas de enchente e encostas instáveis.</li><li>Observe galhos mortos, rochas, drenagem, vento e rota de saída.</li><li>Evite locais onde fumaça ou gases possam ficar presos.</li></ul></section><section class="panel"><h2>Chuva e vento</h2><ul class="protocol"><li>Incline a cobertura para escoar água.</li><li>Evite bolsas de água na lona.</li><li>Use pontos de ancoragem sólidos e revise a tensão.</li></ul></section><section class="panel"><h2>Frio e chão</h2><ul class="protocol"><li>Isole o corpo do solo.</li><li>Mantenha roupas secas e reduza passagem direta de vento.</li><li>Evite suor excessivo no frio.</li></ul></section><section class="panel"><h2>Calor</h2><ul class="protocol"><li>Priorize sombra e ventilação.</li><li>Evite lona/plástico fechado que vire uma estufa.</li><li>Reduza esforço nos períodos mais quentes.</li></ul></section><section class="panel"><h2>🔥 Fogo</h2><div class="notice danger">Nunca use chama, carvão, fogareiro ou gerador em abrigo fechado ou mal ventilado.</div></section>`}
function renderKnots(){view.innerHTML=`${pageHeader("🪢","Nós e cordas","Consulta rápida para tarefas gerais; não é treinamento de escalada ou resgate.")}<div class="notice warning">Um nó conhecido não transforma uma corda comum em equipamento de segurança de vida.</div><div class="list">${KNOTS.map(k=>`<article class="list-card"><h3>${k.icon} ${k.name}</h3><p><strong>Uso:</strong> ${k.use}</p><div class="meta">⚠️ ${k.warning}</div></article>`).join("")}</div><button class="wide-more" data-nav="recursos"><span>📚</span><div><strong>Meus vídeos/PDFs sobre nós</strong><small>Cadastre onde cada arquivo está salvo</small></div><b>›</b></button>`}

function navigationTools(prefix){return `<details class="tool-details"><summary>Distância e azimute</summary><div class="details-body"><form id="${prefix}DistanceForm"><div class="form-grid"><div class="field"><label>Latitude A</label><input name="lat1" type="number" step="any" required></div><div class="field"><label>Longitude A</label><input name="lon1" type="number" step="any" required></div><div class="field"><label>Latitude B</label><input name="lat2" type="number" step="any" required></div><div class="field"><label>Longitude B</label><input name="lon2" type="number" step="any" required></div></div><button class="btn primary full" type="submit">Calcular</button><div id="${prefix}DistanceResult" class="result" hidden></div></form></div></details><details class="tool-details"><summary>Decimal → graus/minutos/segundos</summary><div class="details-body"><form id="${prefix}DmsForm"><div class="form-grid"><div class="field"><label>Latitude</label><input name="lat" type="number" step="any" min="-90" max="90" required></div><div class="field"><label>Longitude</label><input name="lon" type="number" step="any" min="-180" max="180" required></div></div><button class="btn primary full" type="submit">Converter</button><div id="${prefix}DmsResult" class="result" hidden></div></form></div></details><details class="tool-details"><summary>Graus/minutos/segundos → decimal</summary><div class="details-body"><form id="${prefix}DecimalForm"><div class="form-grid four"><div class="field"><label>Lat °</label><input name="latD" type="number" min="0" max="90" required></div><div class="field"><label>Lat min</label><input name="latM" type="number" min="0" max="59.999" step="any" required></div><div class="field"><label>Lat seg</label><input name="latS" type="number" min="0" max="59.999" step="any" required></div><div class="field"><label>Direção</label><select name="latDir"><option>N</option><option>S</option></select></div><div class="field"><label>Lon °</label><input name="lonD" type="number" min="0" max="180" required></div><div class="field"><label>Lon min</label><input name="lonM" type="number" min="0" max="59.999" step="any" required></div><div class="field"><label>Lon seg</label><input name="lonS" type="number" min="0" max="59.999" step="any" required></div><div class="field"><label>Direção</label><select name="lonDir"><option>W</option><option>E</option></select></div></div><button class="btn primary full" type="submit">Converter</button><div id="${prefix}DecimalResult" class="result" hidden></div></form></div></details>`}
function renderNavigation(){view.innerHTML=`${pageHeader("🧭","Navegação","Coordenadas e orientação para complementar seu MAPS.ME offline.")}<section class="panel priority-panel"><h2>📍 Minha posição</h2><div class="notice">GPS pode funcionar sem internet, mas depende do aparelho, dos sinais dos satélites e das condições do local.</div>${lastPositionHTML()}<button class="btn primary full" data-gps="nav">Obter posição atual</button><div id="navGpsResult" class="result" hidden></div></section><section class="panel"><h2>🧭 Bússola experimental</h2><div class="compass-wrap"><div class="compass-ring"><span class="mark n">N</span><span class="mark s">S</span><span class="mark e">E</span><span class="mark w">W</span><div id="compassNeedle" class="compass-needle"></div><div class="compass-center"></div></div><div id="compassHeading" class="compass-value">—</div><div id="compassNote" class="compass-note">Sensor ainda não iniciado.</div></div><div class="btn-row"><button class="btn primary" data-action="start-compass">Iniciar bússola</button><button class="btn" data-action="stop-compass">Parar</button></div><details class="tool-details"><summary>Como tentar recalibrar</summary><div class="details-body"><ol class="protocol"><li>Afaste o celular de ímãs, alto-falantes, metal grande e cabos energizados.</li><li>Movimente o aparelho lentamente desenhando um “8” no ar algumas vezes.</li><li>Compare com mapa, Sol ou outro método de orientação conhecido.</li></ol></div></details><div class="notice warning">Experimental: a leitura varia por aparelho/navegador e pode ter erro. Não use como instrumento de precisão ou como único meio de navegação.</div></section>${navigationTools("nav")}`}

function energyTools(prefix){return `<section class="panel"><h2>Autonomia pelo consumo</h2><form id="${prefix}RuntimeForm"><div class="form-grid"><div class="field"><label>Bateria atual (%)</label><input name="battery" type="number" min="0.1" max="100" step="0.1" value="80" required></div><div class="field"><label>Consumo (%/h)</label><input name="drain" type="number" min="0.01" step="0.01" value="5" required></div></div><button class="btn primary full" type="submit">Estimar autonomia</button><div id="${prefix}RuntimeResult" class="result" hidden></div></form></section><section class="panel"><h2>Power bank</h2><form id="${prefix}PowerForm"><div class="form-grid"><div class="field"><label>Banco (mAh)</label><input name="pbMah" type="number" min="1" value="20000" required></div><div class="field"><label>Tensão banco (V)</label><input name="pbV" type="number" min="0.1" step="0.01" value="3.7" required></div><div class="field"><label>Eficiência (%)</label><input name="eff" type="number" min="1" max="100" value="80" required></div><div class="field"><label>Celular (mAh)</label><input name="phoneMah" type="number" min="1" value="5000" required></div><div class="field"><label>Tensão celular (V)</label><input name="phoneV" type="number" min="0.1" step="0.01" value="3.85" required></div></div><button class="btn primary full" type="submit">Estimar cargas</button><div id="${prefix}PowerResult" class="result" hidden></div></form></section>`}
function batteryBudget(prefix){return `<form id="${prefix}BudgetForm"><div class="form-grid three"><div class="field"><label>Bateria atual (%)</label><input name="battery" type="number" min="0" max="100" value="60" required></div><div class="field"><label>Precisa durar (h)</label><input name="hours" type="number" min="1" value="36" required></div><div class="field"><label>Reserva final (%)</label><input name="reserve" type="number" min="0" max="100" value="10" required></div></div><button class="btn primary full" type="submit">Criar orçamento</button><div id="${prefix}BudgetResult" class="result" hidden></div></form>`}
function renderEnergy(){view.innerHTML=`${pageHeader("🔋","Energia","Planeje quanto pode gastar e preserve comunicação.")}<section class="panel priority-panel"><h2>Orçamento de bateria</h2>${batteryBudget("energy")}</section><section class="panel"><h2>Economia rápida</h2><ul class="protocol"><li>Ative o modo economia de bateria.</li><li>Reduza brilho e tempo de tela.</li><li>Desative Bluetooth e localização quando não forem necessários.</li><li>Evite vídeo, jogos e sincronizações desnecessárias.</li><li>Evite tentativas repetidas de conexão; use o telefone em intervalos definidos.</li><li>Use modo avião quando apropriado e preserve carga para comunicação de emergência.</li><li>Proteja baterias de calor, água e dano físico.</li></ul></section>${energyTools("energy")}<div class="notice warning">Resultados de energia são estimativas; capacidade realmente utilizável pode ser menor por conversão, perdas, temperatura, cabo, desgaste e características do equipamento.</div>`}

function renderCommunication(){const p=getLastPosition(),coords=p?`${Number(p.lat).toFixed(6)}, ${Number(p.lon).toFixed(6)}`:"";view.innerHTML=`${pageHeader("📻","Comunicação","Mensagem curta, horários definidos e meios redundantes.")}<section class="panel priority-panel"><h2>Gerador de mensagem SOS</h2><form id="sosForm"><div class="form-grid"><div class="field"><label>Pessoas no grupo</label><input name="people" type="number" min="1" value="1" required></div><div class="field"><label>Feridos</label><input name="injured" type="number" min="0" value="0" required></div></div><div class="field"><label>Situação</label><input name="situation" placeholder="Ex.: perdido em área rural" required></div><div class="field"><label>Ajuda necessária</label><input name="need" placeholder="Ex.: resgate / atendimento médico"></div><div class="field"><label>Coordenadas</label><input name="coords" value="${escapeHTML(coords)}" placeholder="Obtenha pelo GPS se necessário"></div><div class="field"><label>Próximo horário de contato</label><input name="next" placeholder="Ex.: 18:00"></div><button class="btn primary full" type="submit">Gerar mensagem</button><div id="sosResult" class="result" hidden></div></form></section><section class="panel"><h2>Formato mínimo</h2><div class="template-block"><strong>QUEM</strong> · <strong>ONDE</strong> · <strong>CONDIÇÃO</strong> · <strong>PRECISO</strong> · <strong>PRÓXIMO CONTATO</strong></div></section><section class="panel"><h2>📱 Celular / SMS</h2><p>Evite tentativas contínuas; mensagens curtas e horários definidos ajudam a preservar bateria.</p></section><section class="panel"><h2>📻 Rádio / Meshtastic / Bitchat</h2><p>Use apenas equipamentos e redes já configurados e testados. Mantenha um ponto de encontro físico como redundância.</p></section><section class="panel"><h2>… --- … SOS em Morse</h2><p>Três sinais curtos, três longos e três curtos.</p></section><button class="wide-more" data-nav="plano"><span>🗺️</span><div><strong>Plano de comunicação</strong><small>Canais, horários e ponto de encontro</small></div><b>›</b></button>`}

function renderChecklist(){const items=getChecklist(),done=items.filter(i=>i.done).length,percent=items.length?Math.round(done/items.length*100):0;view.innerHTML=`${pageHeader("🎒","Checklist","Itens salvos localmente neste aparelho.")}<section class="panel"><div class="status-line"><span><strong>${done}</strong> de <strong>${items.length}</strong> marcados</span><span class="pill">${percent}%</span></div><div class="progress"><span style="width:${percent}%"></span></div><div class="btn-row"><button class="btn" data-action="check-all">Marcar todos</button><button class="btn" data-action="uncheck-all">Desmarcar todos</button><button class="btn danger" data-action="clear-done">Limpar concluídos</button></div></section><section class="panel"><form id="checklistAddForm"><div class="form-grid"><div class="field"><label>Item</label><input name="text" maxlength="100" required></div><div class="field"><label>Categoria</label><input name="category" maxlength="60"></div></div><button class="btn primary full" type="submit">Adicionar</button></form></section><div class="list">${items.map(i=>`<article class="check-item ${i.done?"done":""}"><input type="checkbox" data-check="${escapeHTML(i.id)}" ${i.done?"checked":""}><div class="check-content"><strong>${escapeHTML(i.text)}</strong><small>${escapeHTML(i.category||"Sem categoria")}</small></div><div class="mini-actions"><button class="mini-button" data-edit-check="${escapeHTML(i.id)}">✎</button><button class="mini-button" data-delete-check="${escapeHTML(i.id)}">🗑</button></div></article>`).join("")||`<div class="empty">Nenhum item.</div>`}</div>`}
function renderContacts(){const c=getContacts();view.innerHTML=`${pageHeader("📞","Contatos","Contatos personalizados ficam somente neste aparelho.")}<section class="panel">${emergencyCalls()}</section><section class="panel"><form id="contactAddForm"><div class="form-grid"><div class="field"><label>Nome</label><input name="name" maxlength="80" required></div><div class="field"><label>Telefone</label><input name="phone" inputmode="tel" maxlength="40" required></div></div><div class="field"><label>Observação</label><input name="note" maxlength="120"></div><button class="btn primary full" type="submit">Salvar contato</button></form></section><div class="list">${c.map(x=>`<article class="list-card contact-card"><div><div class="contact-name">${escapeHTML(x.name)}</div><div class="contact-number">${escapeHTML(x.phone)}</div>${x.note?`<div class="meta">${escapeHTML(x.note)}</div>`:""}<div class="btn-row"><button class="btn" data-edit-contact="${escapeHTML(x.id)}">Editar</button><button class="btn danger" data-delete-contact="${escapeHTML(x.id)}">Excluir</button></div></div><a class="call-circle" href="tel:${escapeHTML(x.phone)}">📞</a></article>`).join("")||`<div class="empty">Nenhum contato personalizado.</div>`}</div>`}
function renderPlan(){const p=getPlan();view.innerHTML=`${pageHeader("🗺️","Plano de emergência","Defina antes: onde encontrar o grupo e quando tentar comunicação.")}<form id="planForm" class="panel"><div class="field"><label>Ponto de encontro principal</label><input name="meeting" value="${escapeHTML(p.meeting)}"></div><div class="field"><label>Ponto alternativo</label><input name="backupMeeting" value="${escapeHTML(p.backupMeeting)}"></div><div class="field"><label>Rádio / canal / frequência</label><input name="radio" value="${escapeHTML(p.radio)}"></div><div class="field"><label>Horários de contato/escuta</label><input name="checkin" value="${escapeHTML(p.checkin)}" placeholder="Ex.: 08:00, 14:00 e 20:00"></div><div class="field"><label>Método alternativo</label><input name="backupMethod" value="${escapeHTML(p.backupMethod)}" placeholder="Ex.: SMS → rádio → ponto de encontro"></div><div class="field"><label>Mensagem padrão</label><textarea name="message">${escapeHTML(p.message)}</textarea></div><div class="field"><label>Observações</label><textarea name="notes">${escapeHTML(p.notes)}</textarea></div><button class="btn primary full" type="submit">Salvar plano localmente</button></form>`}
function renderICE(){const i=getICE();view.innerHTML=`${pageHeader("🪪","Ficha ICE","Opcional. Preencha apenas o que você quer deixar disponível neste aparelho.")}<div class="notice warning">Informações desta ficha são referências declaradas pelo usuário; não substituem avaliação médica.</div><form id="iceForm" class="panel"><div class="form-grid"><div class="field"><label>Nome</label><input name="name" value="${escapeHTML(i.name)}"></div><div class="field"><label>Data de nascimento</label><input name="birthDate" type="date" value="${escapeHTML(i.birthDate)}"></div><div class="field"><label>Contato ICE</label><input name="iceName" value="${escapeHTML(i.iceName)}"></div><div class="field"><label>Telefone ICE</label><input name="icePhone" inputmode="tel" value="${escapeHTML(i.icePhone)}"></div><div class="field"><label>Tipo sanguíneo (se souber)</label><input name="bloodType" value="${escapeHTML(i.bloodType)}"></div><div class="field"><label>Alergias declaradas</label><input name="allergies" value="${escapeHTML(i.allergies)}"></div><div class="field"><label>Medicamentos declarados</label><input name="medications" value="${escapeHTML(i.medications)}"></div><div class="field"><label>Condições / observações</label><input name="conditions" value="${escapeHTML(i.conditions)}"></div></div><div class="field"><label>Outras notas</label><textarea name="notes">${escapeHTML(i.notes)}</textarea></div><button class="btn primary full" type="submit">Salvar ficha neste aparelho</button></form>`}

function renderJournal(){const entries=getJournal().sort((a,b)=>String(b.timestamp).localeCompare(String(a.timestamp)));view.innerHTML=`${pageHeader("📝","Diário da ocorrência","Registre uma linha do tempo simples com horário automático.")}<section class="panel"><form id="journalForm"><div class="form-grid"><div class="field"><label>Tipo</label><select name="type"><option>Geral</option><option>Localização</option><option>Saúde</option><option>Comunicação</option><option>Energia</option><option>Água</option></select></div><div class="field"><label><input name="withLocation" type="checkbox"> anexar última posição</label></div></div><div class="field"><label>Registro</label><textarea name="text" required placeholder="Ex.: água começou a subir na rua"></textarea></div><button class="btn primary full" type="submit">Registrar agora</button></form></section><div class="timeline">${entries.map(e=>`<article class="timeline-item"><div class="timeline-time">${escapeHTML(e.type)} · ${formatWhen(e.timestamp)}</div><p>${escapeHTML(e.text)}</p>${e.position?`<div class="timeline-location">📍 ${Number(e.position.lat).toFixed(6)}, ${Number(e.position.lon).toFixed(6)}</div>`:""}<button class="text-button" data-delete-journal="${e.id}">Excluir</button></article>`).join("")||`<div class="empty">Nenhum registro ainda.</div>`}</div>`}
function inventoryBadges(item){const s=inventoryStatus(item),parts=[];if(s.low)parts.push(`<span class="attention-badge">estoque baixo</span>`);if(s.expired)parts.push(`<span class="attention-badge danger-badge">vencido</span>`);else if(s.expiring)parts.push(`<span class="attention-badge">vence em ${s.dd} dia(s)</span>`);return parts.join(" ")}
function renderInventory(){const items=getInventory();view.innerHTML=`${pageHeader("📦","Estoque de emergência","Quantidades, nível mínimo e validade. Tudo local.")}<section class="panel"><form id="inventoryForm"><div class="form-grid"><div class="field"><label>Item</label><input name="name" required></div><div class="field"><label>Categoria</label><input name="category"></div><div class="field"><label>Quantidade</label><input name="quantity" type="number" min="0" step="any" value="1" required></div><div class="field"><label>Unidade</label><input name="unit" placeholder="L, un, kg..."></div><div class="field"><label>Mínimo desejado</label><input name="minimum" type="number" min="0" step="any" value="0"></div><div class="field"><label>Validade (opcional)</label><input name="expiry" type="date"></div></div><button class="btn primary full" type="submit">Adicionar ao estoque</button></form></section><div class="list">${items.map(i=>{const s=inventoryStatus(i);return `<article class="list-card inventory-card ${s.expired?"expired":s.low?"low":""}"><h3>${escapeHTML(i.name)}</h3><p>${escapeHTML(i.category||"Sem categoria")}${i.expiry?` · validade ${formatDate(i.expiry)}`:""}</p><div>${inventoryBadges(i)}</div><div class="quantity-row"><button data-inventory-delta="-1" data-id="${i.id}">−</button><div class="quantity-value">${Number(i.quantity)} ${escapeHTML(i.unit||"")}</div><button data-inventory-delta="1" data-id="${i.id}">+</button></div><div class="btn-row"><button class="btn" data-edit-inventory="${i.id}">Editar</button><button class="btn danger" data-delete-inventory="${i.id}">Excluir</button></div></article>`}).join("")||`<div class="empty">Nenhum item cadastrado.</div>`}</div>`}
function renderMaintenance(){const items=getMaintenance();view.innerHTML=`${pageHeader("🛠️","Validades e manutenção","Lembretes locais para testar, recarregar ou substituir equipamentos.")}<section class="panel"><form id="maintenanceForm"><div class="form-grid"><div class="field"><label>Equipamento / tarefa</label><input name="name" required></div><div class="field"><label>Próxima revisão</label><input name="due" type="date" required></div></div><div class="field"><label>Observação</label><input name="note" placeholder="Ex.: testar rádio e recarregar bateria"></div><button class="btn primary full" type="submit">Adicionar revisão</button></form></section><div class="list">${items.map(i=>{const s=maintenanceStatus(i);return `<article class="list-card maintenance-card ${s.due?"due":""}"><h3>${escapeHTML(i.name)}</h3><p>Próxima: ${formatDate(i.due)}${i.note?` · ${escapeHTML(i.note)}`:""}</p>${s.due?`<span class="attention-badge">revisão vencida/hoje</span>`:s.soon?`<span class="attention-badge">em ${s.dd} dia(s)</span>`:""}<div class="btn-row"><button class="btn" data-edit-maintenance="${i.id}">Editar</button><button class="btn danger" data-delete-maintenance="${i.id}">Excluir</button></div></article>`}).join("")||`<div class="empty">Nenhuma revisão cadastrada.</div>`}</div>`}

er" step="any" required></div><div class="field"><label>Conversão</label><select name="conversion"><option value="km-mi">km → milhas</option><option value="mi-km">milhas → km</option><option value="m-ft">metros → pés</option><option value="ft-m">pés → metros</option><option value="l-gal">litros → galões US</option><option value="gal-l">galões US → litros</option><option value="c-f">°C → °F</option><option value="f-c">°F → °C</option><option value="kg-lb">kg → lb</option><option value="lb-kg">lb → kg</option></select></div></div><button class="btn primary full" type="submit">Converter</button><div id="unitResult" class="result" hidden></div></form></div></details><details class="tool-details"><summary>🧭 Coordenadas, distância e azimute</summary><div class="details-body">${navigationTools("calcNav")}</div></details><details class="tool-details"><summary>🪢 Comprimento estimado de corda</summary><div class="details-body"><form id="ropeForm"><div class="form-grid"><div class="field"><label>Nº de trechos</label><input name="segments" type="number" min="1" value="1" required></div><div class="field"><label>Comprimento/trecho (m)</label><input name="length" type="number" min="0.01" step="any" required></div><div class="field"><label>Margem extra (%)</label><input name="margin" type="number" min="0" value="20" required></div><div class="field"><label>Extra nós/ajustes (m)</label><input name="extra" type="number" min="0" step="any" value="0" required></div></div><button class="btn primary full" type="submit">Estimar</button><div id="ropeResult" class="result" hidden></div></form><div class="notice warning">Planeja comprimento; não calcula resistência ou segurança para escalada/resgate.</div></div></details>`}


function openLibraryDB(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window)){reject(new Error("IndexedDB não disponível"));return}const req=indexedDB.open(LIB_DB_NAME,LIB_DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains("items")){const store=db.createObjectStore("items",{keyPath:"id"});store.createIndex("sourceId","sourceId",{unique:false});store.createIndex("signature","signature",{unique:false})}if(!db.objectStoreNames.contains("sources"))db.createObjectStore("sources",{keyPath:"id"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error("Falha ao abrir IndexedDB"))})}
async function libraryGet(store,key){const db=await openLibraryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readonly"),req=tx.objectStore(store).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(tx.error)}})}
async function libraryGetAll(store){const db=await openLibraryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readonly"),req=tx.objectStore(store).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(tx.error)}})}
async function libraryPut(store,value){const db=await openLibraryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(value);tx.oncomplete=()=>{db.close();resolve(value)};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function libraryPutMany(store,values){if(!values.length)return;const db=await openLibraryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite"),os=tx.objectStore(store);for(const value of values)os.put(value);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function libraryDelete(store,key){const db=await openLibraryDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(key);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function libraryClearAll(){try{const db=await openLibraryDB();await new Promise((resolve,reject)=>{const tx=db.transaction(["items","sources"],"readwrite");tx.objectStore("items").clear();tx.objectStore("sources").clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch{}librarySessionFiles.clear();librarySourceCache.clear();cleanupLibraryThumbUrls();cleanupLibraryViewerUrls()}
async function libraryDbRoundTrip(){try{const test={id:"__library_test__",name:"test",addedAt:new Date().toISOString()};await libraryPut("items",test);const read=await libraryGet("items",test.id);await libraryDelete("items",test.id);return !!(read&&read.name==="test")}catch{return false}}
function cleanupLibraryThumbUrls(){if(libraryThumbObserver){try{libraryThumbObserver.disconnect()}catch{}libraryThumbObserver=null}for(const url of libraryThumbUrls)try{URL.revokeObjectURL(url)}catch{}libraryThumbUrls.clear()}
function cleanupLibraryViewerUrls(){for(const url of libraryViewerUrls)try{URL.revokeObjectURL(url)}catch{}libraryViewerUrls.clear()}
function libraryKind(file){const mime=String(file?.type||"").toLowerCase(),name=String(file?.name||"").toLowerCase();if(mime.startsWith("image/")||/\.(jpe?g|png|webp|gif|bmp|avif|heic|heif)$/.test(name))return "image";if(mime.startsWith("video/")||/\.(mp4|webm|mkv|mov|m4v|3gp|avi)$/.test(name))return "video";if(mime==="application/pdf"||name.endsWith(".pdf"))return "pdf";return "other"}
function libraryKindLabel(kind){return {image:"Foto",video:"Vídeo",pdf:"PDF",other:"Outro"}[kind]||"Outro"}
function libraryKindIcon(kind){return {image:"🖼️",video:"🎬",pdf:"📄",other:"📦"}[kind]||"📦"}
function formatBytes(bytes){const n=Number(bytes)||0;if(n<1024)return `${n} B`;if(n<1048576)return `${(n/1024).toFixed(n<10240?1:0)} KB`;if(n<1073741824)return `${(n/1048576).toFixed(n<10485760?1:0)} MB`;return `${(n/1073741824).toFixed(2)} GB`}
function formatDuration(sec){const n=Number(sec);if(!Number.isFinite(n)||n<=0)return "";const h=Math.floor(n/3600),m=Math.floor((n%3600)/60),s=Math.round(n%60);return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`}
function autoLibraryCategory(name,path=""){const t=normalizeText(`${name} ${path}`);const rules=[["Emergência",/emerg|sos|desastre|enchent|incendio|acidente/],["Água",/agua|hidrat|purifica|filtro|filtra/],["Primeiros socorros",/primeir|socorro|medic|ferid|hemorrag|queim|cobra|serpente|rcp|engasg|fratur/],["Abrigo",/abrigo|lona|barraca|shelter/],["Fogo",/fogo|fogareiro|ignicao|lenha|fire/],["Nós e cordas",/\bno\b|nos|corda|lais|prusik|amarra/],["Alimentação",/aliment|comida|cozinha|cozimento|food/],["Higiene",/higiene|saneamento|residuo|sanitari/],["Navegação",/naveg|mapa|gps|bussola|coordenad|azimut/],["Comunicação",/comunic|radio|meshtastic|morse|sinal/],["Energia",/energia|bateria|power.?bank|solar|carreg/]];for(const [cat,re] of rules)if(re.test(t))return cat;return "Geral"}
function librarySignature(file,relativePath=""){return `${relativePath||file.name}|${Number(file.size)||0}|${Number(file.lastModified)||0}`}
function cleanLibraryTags(value){const list=Array.isArray(value)?value:String(value||"").split(",");return [...new Set(list.map(x=>String(x).trim()).filter(Boolean).slice(0,20))]}
function libraryMetadataFromFile(file,opts={}){const kind=libraryKind(file),path=opts.relativePath||file.webkitRelativePath||file.name;return {id:opts.id||uid("lib"),name:file.name,type:file.type||"",kind,size:Number(file.size)||0,lastModified:Number(file.lastModified)||0,relativePath:path,sourceId:opts.sourceId||null,access:opts.access||"session",handle:opts.handle||null,category:opts.category||autoLibraryCategory(file.name,path),tags:cleanLibraryTags(opts.tags||[]),favorite:!!opts.favorite,addedAt:opts.addedAt||new Date().toISOString(),lastOpened:opts.lastOpened||null,useCount:Number(opts.useCount)||0,duration:Number(opts.duration)||null,signature:librarySignature(file,path)}}
async function ensureHandlePermission(handle,ask=false){if(!handle)return false;try{if(typeof handle.queryPermission!=="function")return true;let state=await handle.queryPermission({mode:"read"});if(state==="granted")return true;if(ask&&typeof handle.requestPermission==="function")state=await handle.requestPermission({mode:"read"});return state==="granted"}catch{return false}}
async function resolveDirectoryFileHandle(dirHandle,relativePath){const parts=String(relativePath||"").split("/").filter(Boolean);let dir=dirHandle;for(let i=0;i<parts.length-1;i++)dir=await dir.getDirectoryHandle(parts[i]);return dir.getFileHandle(parts[parts.length-1])}
async function getLibraryFile(item,askPermission=false){if(!item)return null;if(librarySessionFiles.has(item.id))return librarySessionFiles.get(item.id);if(item.handle){if(!(await ensureHandlePermission(item.handle,askPermission)))return null;try{return await item.handle.getFile()}catch{return null}}if(item.sourceId){let source=librarySourceCache.get(item.sourceId);if(!source){source=await libraryGet("sources",item.sourceId);if(source)librarySourceCache.set(source.id,source)}if(source?.handle){if(!(await ensureHandlePermission(source.handle,askPermission)))return null;try{const fh=await resolveDirectoryFileHandle(source.handle,item.relativePath);return await fh.getFile()}catch{return null}}}return null}
async function getOrCreateModernSource(handle){const all=await libraryGetAll("sources");for(const src of all){if(src.handle&&typeof src.handle.isSameEntry==="function"){try{if(await src.handle.isSameEntry(handle)){src.handle=handle;librarySourceCache.set(src.id,src);await libraryPut("sources",src);return src}}catch{}}}const source={id:uid("dir"),name:handle.name||"Pasta",kind:"directory",handle,addedAt:new Date().toISOString(),ignoredPaths:[]};await libraryPut("sources",source);librarySourceCache.set(source.id,source);return source}
async function getOrCreateFallbackSource(name){const all=await libraryGetAll("sources");let source=all.find(x=>x.kind==="fallback-directory"&&x.name===name);if(!source){source={id:uid("dir"),name:name||"Pasta selecionada",kind:"fallback-directory",handle:null,addedAt:new Date().toISOString(),ignoredPaths:[]};await libraryPut("sources",source)}librarySourceCache.set(source.id,source);return source}
async function indexFilesIntoLibrary(files,opts={}){const list=Array.from(files||[]).slice(0,LIBRARY_SCAN_LIMIT);if(!list.length)return 0;const existing=await libraryGetAll("items"),byPath=new Map(existing.filter(x=>opts.sourceId&&x.sourceId===opts.sourceId).map(x=>[x.relativePath,x])),bySig=new Map(existing.map(x=>[x.signature,x])),records=[];for(const entry of list){const file=entry.file||entry,relativePath=entry.relativePath||file.webkitRelativePath||file.name;if(opts.ignoredPaths?.includes(relativePath))continue;const signature=librarySignature(file,relativePath),old=(opts.sourceId?byPath.get(relativePath):null)||bySig.get(signature);const rec=libraryMetadataFromFile(file,{id:old?.id,sourceId:opts.sourceId||old?.sourceId||null,relativePath,access:opts.access||old?.access||"session",handle:entry.handle||opts.handle||old?.handle||null,category:old?.category,tags:old?.tags,favorite:old?.favorite,addedAt:old?.addedAt,lastOpened:old?.lastOpened,useCount:old?.useCount,duration:old?.duration});records.push(rec);if(opts.session!==false)librarySessionFiles.set(rec.id,file)}await libraryPutMany("items",records);return records.length}
async function scanModernDirectory(source,requestPermission=true){if(!source?.handle)return {count:0,limited:false};if(!(await ensureHandlePermission(source.handle,requestPermission)))return {count:0,permission:false};const entries=[];let limited=false;async function walk(handle,path=""){for await(const [name,entry] of handle.entries()){if(entries.length>=LIBRARY_SCAN_LIMIT){limited=true;return}const rel=path?`${path}/${name}`:name;if(entry.kind==="directory")await walk(entry,rel);else{try{const file=await entry.getFile();entries.push({file,relativePath:rel})}catch{}}if(limited)return}}await walk(source.handle);const count=await indexFilesIntoLibrary(entries,{sourceId:source.id,access:"directory",session:false,ignoredPaths:Array.isArray(source.ignoredPaths)?source.ignoredPaths:[]});return {count,limited,permission:true}}
function fallbackFilePicker(directory=false){return new Promise(resolve=>{const input=document.createElement("input");input.type="file";input.multiple=true;if(directory)input.webkitdirectory=true;else input.accept="image/*,video/*,application/pdf,.pdf";input.style.display="none";document.body.appendChild(input);input.addEventListener("change",()=>{const files=Array.from(input.files||[]);input.remove();resolve(files)},{once:true});input.addEventListener("cancel",()=>{input.remove();resolve([])},{once:true});try{if(typeof input.showPicker==="function")input.showPicker();else input.click()}catch{input.click()}})}
async function addLibraryFiles(){try{let count=0;if("showOpenFilePicker" in window){try{const handles=await window.showOpenFilePicker({multiple:true});const entries=[];for(const handle of handles){const file=await handle.getFile();entries.push({file,handle})}count=await indexFilesIntoLibrary(entries,{access:"file-handle",session:false})}catch(e){if(e?.name==="AbortError")return;const files=await fallbackFilePicker(false);count=await indexFilesIntoLibrary(files,{access:"session",session:true})}}else{const files=await fallbackFilePicker(false);count=await indexFilesIntoLibrary(files,{access:"session",session:true})}showToast(count?`${count} arquivo(s) adicionados à biblioteca`:`Nenhum arquivo selecionado`);renderLibrary()}catch(e){showToast("Não foi possível adicionar arquivos: "+(e?.message||"erro"))}}
async function addLibraryFolder(){try{let count=0;if("showDirectoryPicker" in window){try{const handle=await window.showDirectoryPicker({mode:"read"}),source=await getOrCreateModernSource(handle),result=await scanModernDirectory(source,true);count=result.count;if(result.limited)showToast(`Primeiros ${LIBRARY_SCAN_LIMIT} arquivos indexados; divida a biblioteca em pastas menores se necessário.`)}catch(e){if(e?.name==="AbortError")return;const files=await fallbackFilePicker(true);if(!files.length)return;const root=(files[0].webkitRelativePath||"Pasta selecionada").split("/")[0]||"Pasta selecionada",source=await getOrCreateFallbackSource(root),entries=files.map(file=>({file,relativePath:(file.webkitRelativePath||file.name).split("/").slice(1).join("/")||file.name}));count=await indexFilesIntoLibrary(entries,{sourceId:source.id,access:"fallback-directory",session:true,ignoredPaths:source.ignoredPaths||[]})}}else{const files=await fallbackFilePicker(true);if(!files.length)return;const root=(files[0].webkitRelativePath||"Pasta selecionada").split("/")[0]||"Pasta selecionada",source=await getOrCreateFallbackSource(root),entries=files.map(file=>({file,relativePath:(file.webkitRelativePath||file.name).split("/").slice(1).join("/")||file.name}));count=await indexFilesIntoLibrary(entries,{sourceId:source.id,access:"fallback-directory",session:true,ignoredPaths:source.ignoredPaths||[]})}showToast(`${count} arquivo(s) indexados da pasta`);renderLibrary()}catch(e){showToast("Não foi possível adicionar a pasta: "+(e?.message||"erro"))}}
async function refreshLibraryFolders(){const sources=await libraryGetAll("sources");librarySourceCache.clear();sources.forEach(x=>librarySourceCache.set(x.id,x));let total=0,needFallback=0;for(const source of sources){if(source.handle){const r=await scanModernDirectory(source,true);total+=r.count}else if(source.kind==="fallback-directory")needFallback++}showToast(total?`${total} arquivo(s) atualizados${needFallback?`; ${needFallback} pasta(s) precisam ser selecionadas novamente neste navegador`:""}`:needFallback?"Selecione novamente as pastas marcadas como reconectar":"Nenhuma pasta persistente cadastrada");renderLibrary()}

const radians=v=>v*Math.PI/180, degrees=v=>v*180/Math.PI;

function cardinal(h){const names=["N","NE","L","SE","S","SO","O","NO"];return names[Math.round(h/45)%8]}
async function getGPS(prefix){const result=document.getElementById(prefix+"GpsResult");if(result){result.hidden=false;result.innerHTML="<small>Obtendo posição… Isso pode levar mais tempo sem dados móveis.</small>"}if(!navigator.geolocation){if(result)result.innerHTML='<strong>Localização indisponível.</strong><small>Este navegador não oferece acesso ao GPS/localização.</small>';return}navigator.geolocation.getCurrentPosition(pos=>{const p={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy,timestamp:new Date().toISOString()};saveJSON(STORAGE.lastPosition,p);const text=`${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}`,share=`📍 Localização: ${text} | Precisão aproximada: ±${Math.round(p.accuracy)} m | Horário: ${formatWhen(p.timestamp)}`,geo=`geo:${p.lat},${p.lon}?q=${p.lat},${p.lon}`;if(result)result.innerHTML=`<strong class="coord">${text}</strong><small>Precisão informada: ±${Math.round(p.accuracy)} m · ${formatWhen(p.timestamp)} · posição salva localmente.</small><div class="btn-row"><button class="btn" data-copy="${escapeHTML(text)}">Copiar</button><button class="btn" data-share="${escapeHTML(share)}">Compartilhar</button><a class="btn link-btn" href="${geo}">Abrir no mapa</a></div><small>GPS pode funcionar sem internet, mas depende dos sinais dos satélites e do aparelho.</small>`;showToast("Última posição atualizada")},err=>{const msg={1:"Permissão de localização negada. Autorize a localização nas permissões do navegador/app.",2:"Localização indisponível. Tente ir para uma área com melhor visão do céu.",3:"Tempo esgotado ao procurar a posição. Tente novamente em local mais aberto."}[err.code]||"Erro desconhecido ao obter localização.";if(result)result.innerHTML=`<strong>Não foi possível obter a posição.</strong><small>${msg}</small><small>GPS pode funcionar sem internet, mas depende dos sinais dos satélites e do aparelho.</small>`},{enableHighAccuracy:true,timeout:20000,maximumAge:15000})}

async function startCompass(){const heading=document.getElementById("compassHeading"),needle=document.getElementById("compassNeedle"),note=document.getElementById("compassNote");if(!heading||!needle)return;if(typeof DeviceOrientationEvent==="undefined"){note.textContent="Sensor de orientação não disponível neste navegador/aparelho.";return}try{if(typeof DeviceOrientationEvent.requestPermission==="function"){const p=await DeviceOrientationEvent.requestPermission();if(p!=="granted"){note.textContent="Permissão do sensor negada.";return}}stopCompass();compassEventName="ondeviceorientationabsolute" in window?"deviceorientationabsolute":"deviceorientation";compassHandler=e=>{let h=null,quality="";const screenAngle=Number(screen.orientation?.angle ?? window.orientation ?? 0)||0;if(typeof e.webkitCompassHeading==="number"){h=e.webkitCompassHeading;quality="leitura do sensor"}else if(typeof e.alpha==="number"){h=(360-e.alpha+screenAngle+360)%360;quality=e.absolute===true?"orientação absoluta":"orientação relativa; confirme por outro método"}if(h===null||!Number.isFinite(h)){note.textContent="Sensor presente, mas sem leitura utilizável.";return}heading.textContent=`${h.toFixed(0)}° ${cardinal(h)}`;needle.style.transform=`translate(-50%,0) rotate(${h}deg)`;note.textContent=`${quality}. Compare com mapa e referências físicas.`};window.addEventListener(compassEventName,compassHandler,true);note.textContent="Aguardando sensor…"}catch(e){note.textContent="Bússola indisponível: "+(e?.message||"erro ao iniciar sensor")}}

function validateBackup(raw){if(!isPlainObject(raw))throw new Error("O arquivo JSON não contém um objeto de backup válido.");if(raw.app!==undefined&&raw.app!=="Sobrevivência Offline")throw new Error("Este JSON identifica outro aplicativo e não será importado.");const warnings=[],clean={},arrayFields=["checklist","contacts","favorites","journal","inventory","maintenance","resources"],objectFields=["plan","ice","settings"];let recognized=0;for(const field of arrayFields)if(Object.prototype.hasOwnProperty.call(raw,field)){recognized++;const v=sanitizeBackupArray(field,raw[field],warnings);if(v!==null)clean[field]=v}for(const field of objectFields)if(Object.prototype.hasOwnProperty.call(raw,field)){recognized++;const v=sanitizeBackupObject(field,raw[field],warnings);if(v!==null)clean[field]=v}if(Object.prototype.hasOwnProperty.call(raw,"lastPosition")){recognized++;const pos=raw.lastPosition;if(pos===null)clean.lastPosition=null;else if(isPlainObject(pos)&&Number.isFinite(Number(pos.lat))&&Number.isFinite(Number(pos.lon))&&Math.abs(Number(pos.lat))<=90&&Math.abs(Number(pos.lon))<=180)clean.lastPosition={lat:Number(pos.lat),lon:Number(pos.lon),accuracy:Math.max(0,Number(pos.accuracy)||0),timestamp:validOptionalString(pos.timestamp)?pos.timestamp:null};else warnings.push("lastPosition: posição inválida ignorada")}if(Object.prototype.hasOwnProperty.call(raw,"library")){recognized++;const lib=sanitizeLibraryBackup(raw.library,warnings);if(lib)clean.library=lib}if(!recognized)throw new Error("Nenhum campo de dados reconhecido. O arquivo não parece ser um backup do Sobrevivência Offline.");if(raw.app===undefined&&raw.version===undefined&&raw.schema===undefined&&recognized<2)throw new Error("JSON válido, mas sem identificação suficiente para ser tratado como backup do app.");return {clean,warnings,version:raw.version??"antigo/não informado",schema:raw.schema??"antigo/não informado",created:raw.created??null}}

async function coreOfflineStatus(){const status={swSupported:"serviceWorker" in navigator,swActive:false,cache:false,files:{},storage:false,cacheRead:false,data:false,libraryDb:false};try{if(status.swSupported){const reg=await navigator.serviceWorker.getRegistration();status.swActive=!!(reg&&reg.active&&!reg.waiting)}}catch{}try{status.cache=await caches.has(EXPECTED_CACHE);if(status.cache){const cache=await caches.open(EXPECTED_CACHE);for(const file of CORE_FILES){const url=new URL(file,location.href).href;status.files[file]=!!(await cache.match(url))}status.cacheRead=Object.values(status.files).length===CORE_FILES.length&&Object.values(status.files).every(Boolean)}}catch{}try{const key="__survival_test";localStorage.setItem(key,"ok");status.storage=localStorage.getItem(key)==="ok";localStorage.removeItem(key)}catch{}try{getChecklist();getContacts();getPlan();getFavorites();getICE();getJournal();getInventory();getMaintenance();getResources();getSettings();status.data=true}catch{}status.libraryDb=await libraryDbRoundTrip();status.ready=status.swActive&&status.cache&&status.cacheRead&&status.storage&&status.data&&status.libraryDb;return status}

modal.addEventListener("click",e=>{if(e.target.closest("[data-close-modal]")){closeModal();return}const libShare=e.target.closest("[data-library-share]");if(libShare){shareLibraryItem(libShare.dataset.libraryShare);return}const libExternal=e.target.closest("[data-library-external]");if(libExternal){openLibraryExternal(libExternal.dataset.libraryExternal);return}if(e.target.closest("[data-library-modal-files]")){closeModal();addLibraryFiles();return}if(e.target.closest("[data-library-modal-folder]")){closeModal();addLibraryFolder();return}const fav=e.target.closest("[data-fav-type]");if(fav){e.stopPropagation();const type=fav.dataset.favType,id=fav.dataset.favId;toggleFavorite(type,id);if(type==="emergency")showEmergency(id);else{closeModal();renderView(id)}return}const share=e.target.closest("[data-share]");if(share){shareText(share.dataset.share);return}const copy=e.target.closest("[data-copy]");if(copy){copyText(copy.dataset.copy)}});
modal.addEventListener("submit",async e=>{const f=e.target;if(f.id!=="libraryEditForm")return;e.preventDefault();const item=await libraryGet("items",f.dataset.id);if(!item)return;const d=new FormData(f);item.category=LIBRARY_CATEGORIES.includes(String(d.get("category")))?String(d.get("category")):"Geral";item.tags=cleanLibraryTags(d.get("tags"));item.favorite=d.get("favorite")==="on";await libraryPut("items",item);closeModal();showToast("Organização salva");if(currentView()==="biblioteca")renderLibrary()});
modal.addEventListener("submit",e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(f.id==="checklistEditForm"){const a=getChecklist(),i=a.find(x=>x.id===f.dataset.id);if(i){i.text=String(d.get("text")).trim();i.category=String(d.get("category")||"").trim();saveJSON(STORAGE.checklist,a)}closeModal();renderChecklist()}if(f.id==="contactEditForm"){const a=getContacts(),i=a.find(x=>x.id===f.dataset.id);if(i){i.name=String(d.get("name")).trim();i.phone=String(d.get("phone")).trim();i.note=String(d.get("note")||"").trim();saveJSON(STORAGE.contacts,a)}closeModal();renderContacts()}if(f.id==="inventoryEditForm"){const a=getInventory(),i=a.find(x=>x.id===f.dataset.id);if(i){i.name=String(d.get("name")).trim();i.quantity=Number(d.get("quantity"));i.unit=String(d.get("unit")||"").trim();i.minimum=Number(d.get("minimum")||0);i.expiry=String(d.get("expiry")||"");i.category=String(d.get("category")||"").trim();saveJSON(STORAGE.inventory,a)}closeModal();renderInventory()}if(f.id==="maintenanceEditForm"){const a=getMaintenance(),i=a.find(x=>x.id===f.dataset.id);if(i){i.name=String(d.get("name")).trim();i.due=String(d.get("due"));i.note=String(d.get("note")||"").trim();saveJSON(STORAGE.maintenance,a)}closeModal();renderMaintenance()}if(f.id==="resourceEditForm"){const a=getResources(),i=a.find(x=>x.id===f.dataset.id);if(i){i.type=String(d.get("type")).trim();i.name=String(d.get("name")).trim();i.reference=String(d.get("reference")||"").trim();i.note=String(d.get("note")||"").trim();saveJSON(STORAGE.resources,a)}closeModal();renderResources()}});

document.querySelector(".bottom-nav").addEventListener("click",e=>{const b=e.target.closest("[data-nav]");if(b)renderView(b.dataset.nav)});
document.getElementById("homeButton").addEventListener("click",()=>renderView("home"));
importInput.addEventListener("change",()=>{const f=importInput.files?.[0];if(f)importBackup(f)});
function currentView(){return currentViewName||"home"}
function updateConnection(){if(navigator.onLine){networkStatus.textContent=offlineReady?"● online · offline verificado":"● online · verificando cache";networkStatus.className="online"}else{networkStatus.textContent=offlineReady?"● offline · arquivos verificados":"● offline · não verificado";networkStatus.className="offline"}}
window.addEventListener("online",updateConnection);window.addEventListener("offline",updateConnection);window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;installButton.hidden=false});installButton.addEventListener("click",async()=>{if(!installPrompt){showToast("Use o menu do navegador para instalar");return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.hidden=true});window.addEventListener("appinstalled",()=>{installPrompt=null;installButton.hidden=true;showToast("Aplicativo instalado")});
async function registerServiceWorker(){if(!("serviceWorker" in navigator)){offlineReady=false;updateConnection();return}let reloading=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;reloading=true;location.reload()});try{const reg=await navigator.serviceWorker.register("./service-worker.js",{scope:"./"});const offerUpdate=worker=>{if(!worker)return;const ask=()=>{if(worker.state==="installed"&&navigator.serviceWorker.controller){if(confirm("Nova versão do Sobrevivência Offline foi armazenada com sucesso. Atualizar agora?"))worker.postMessage({type:"SKIP_WAITING"})}};if(worker.state==="installed")ask();else worker.addEventListener("statechange",ask)};if(reg.waiting)offerUpdate(reg.waiting);reg.addEventListener("updatefound",()=>offerUpdate(reg.installing));if(navigator.onLine)reg.update().catch(()=>{});await navigator.serviceWorker.ready;const st=await coreOfflineStatus();offlineReady=!!st.ready;updateConnection()}catch(e){offlineReady=false;updateConnection();console.error(e)}}
function initialView(){const v=new URLSearchParams(location.search).get("view");return v||"home"}
try{migrateData()}catch(error){console.error("Falha na migração de dados",error)}
try{applySettings()}catch(error){console.error("Falha ao aplicar configurações",error)}
try{updateConnection()}catch(error){console.error("Falha no status de conexão",error)}
try{renderView(initialView())}catch(error){
  console.error("Falha ao iniciar interface",error);
  view.innerHTML=`<div class="notice warning"><strong>Não foi possível montar a tela inicial.</strong><br>Os dados locais não foram apagados.</div><div class="btn-row"><button class="btn primary" data-action="repair-home-settings">Corrigir tela inicial</button><button class="btn" data-nav="mais">Todos os recursos</button></div>`;
}
coreOfflineStatus().then(st=>{offlineReady=!!st.ready;updateConnection()}).catch(()=>{});
registerServiceWorker();

</script>
</body>
