<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Centro de ação rápida offline para emergências, sobrevivência, navegação, energia e preparo.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sobrevivência Offline</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icone-192.png">
  <link rel="apple-touch-icon" href="./icone-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <button id="homeButton" class="icon-button" aria-label="Ir para início">🛡️</button>
    <div class="brand">
      <strong>Sobrevivência Offline</strong>
      <span id="networkStatus">Verificando...</span>
    </div>
    <button id="installButton" class="icon-button" aria-label="Instalar aplicativo" hidden>⬇️</button>
  </header>

  <main id="view"></main>

  <nav class="bottom-nav">
    <button data-nav="home" class="nav-button active"><span>⌂</span><small>Início</small></button>
    <button data-nav="emergencias" class="nav-button"><span>🆘</span><small>Emergências</small></button>
    <button data-nav="checklist" class="nav-button"><span>✓</span><small>Checklist</small></button>
    <button data-nav="calculadoras" class="nav-button"><span>🧮</span><small>Calcular</small></button>
    <button data-nav="mais" class="nav-button"><span>☰</span><small>Mais</small></button>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card">
      <header class="modal-header">
        <h2 id="modalTitle"></h2>
        <button class="icon-button" data-close-modal>✕</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <input id="importInput" type="file" accept=".json,application/json" hidden>

  <noscript>Este aplicativo precisa de JavaScript ativado.</noscript>
  <script src="./app.js" defer></script>
</body>
</html>
